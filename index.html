<!doctype html>
<html lang="ru" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF9FA" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('ours_theme_mode_v1');
          if (!stored) {
            try {
              var state = JSON.parse(localStorage.getItem('ours_app_state_v2') || '{}');
              if (state && state.settings && state.settings.theme) {
                stored = state.settings.theme;
              }
            } catch (e) {}
          }
          var isDark = false;
          if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            root.classList.remove('light');
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            if (meta) meta.setAttribute('content', '#FFF9FA');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>OURS — Ежедневный ритуал для двоих</title>
