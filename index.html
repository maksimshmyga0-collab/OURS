<!doctype html>
<html lang="ru" class="dark" data-theme="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function() {
        try {
          var root = document.documentElement;
          root.classList.remove('light');
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#000000');
          try {
            localStorage.setItem('ours_theme_mode_v1', 'dark');
          } catch (e) {}
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OURS — Ежедневный ритуал для двоих</title>
    <meta name="description" content="Приватное приложение для двоих. Маленькие моменты, которые становятся вашей общей историей." />
    <meta property="og:title" content="OURS — Ежедневный ритуал для двоих" />
    <meta property="og:description" content="Приватное приложение для двоих. Маленькие моменты, которые становятся вашей общей историей." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="https://files.catbox.moe/zbcwso.png" />
    <link rel="apple-touch-icon" href="https://files.catbox.moe/zbcwso.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700&display=block">
  </head>
  <body class="bg-[#000000] text-[#FFFFFF] antialiased select-none font-sans overflow-x-hidden">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
